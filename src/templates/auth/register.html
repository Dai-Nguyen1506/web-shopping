{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-12rem)]">
    <div class="w-full max-w-md p-8 rounded-2xl glass shadow-xl">
        <h2 class="text-3xl font-bold text-center bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent mb-6">Đăng Ký Tài Khoản</h2>
        {% if error %}
            <div class="mb-4 p-3 bg-rose-100 border border-rose-200 text-rose-700 text-sm rounded-xl">
                {{ error }}
            </div>
        {% endif %}
        <form action="/register" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Họ và Tên</label>
                <input type="text" name="full_name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white/50 transition-all duration-200">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white/50 transition-all duration-200">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white/50 transition-all duration-200">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-semibold rounded-xl hover:bg-brand-700 shadow-md transition-all duration-200 hover:-translate-y-0.5 mt-2">
                Đăng Ký
            </button>
        </form>
        <p class="text-center text-sm text-slate-600 mt-6">
            Đã có tài khoản? <a href="/login" class="text-brand-600 font-semibold hover:underline">Đăng nhập</a>
        </p>
    </div>
</div>
{% endblock %}
